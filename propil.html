<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Admin - SaputraTech</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-accent: #00f2fe;
            --secondary-accent: #4facfe;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(30, 41, 59, 0.5) 0px, transparent 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .profile-card {
            width: 100%;
            max-width: 380px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            background-color: #22c55e;
            border: 3px solid #0f172a;
            border-radius: 50%;
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .tagline {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            color: #cbd5e1;
            font-style: italic;
            margin-bottom: 24px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--primary-accent);
            transform: translateY(-2px);
        }

        .btn-cta {
            width: 100%;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            color: #0f172a;
            font-weight: 700;
            font-size: 15px;
            border: none;
            border-radius: 14px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: all 0.2s ease;
        }

        .btn-cta:hover {
            color: #0f172a;
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-wrapper">
            <img class="profile-img" src="https://github.com/helehsemvakwkwk/Marzban-subs/blob/main/template-01/images/me.png?raw=true" alt="Profile SaputraTech">
            <span class="status-badge" title="Online"></span>
        </div>

        <div class="name">SaputraTech</div>
        

        <div class="quote-box">
            "Jangan Lupa Shalat!"
        </div>

        <div class="social-links">
            <a href="https://t.me/SaputraTech" target="_blank" class="social-btn" aria-label="Telegram">
                <i class="fab fa-telegram-plane"></i>
            </a>
            <a href="https://www.skartistore.my.id" target="_blank" class="social-btn" aria-label="Server Store">
                <i class="fas fa-server"></i>
            </a>
        </div>

        <a href="https://t.me/SaputraTech" target="_blank" class="btn-cta">
            <i class="fas fa-shield-halved"></i>
            <span>Subscribe Now</span>
        </a>
    </div>

</body>
</html>
